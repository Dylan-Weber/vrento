[package]
name = "vrento"
version = "0.1.0"
authors = ["hypengw <hypengwip@gmail.com>"]
license = "MIT OR Apache-2.0"

[lib]
name = "vrento"
module = "vrento"
archive = "vrento"

[[test]]
name = "vrento"
sources = [
  "tests/main.cpp",
  "tests/foundation.cpp",
  "tests/texture.cpp",
  "tests/texture_vulkan.cpp",
  "tests/texture_registry.cpp",
  "tests/external_swapchain.cpp",
  "tests/extension_names.cpp",
  "tests/uniform.cpp",
  "tests/pipeline_layout.cpp",
  "tests/geometry.cpp",
  "tests/draw_buffer.cpp",
  "tests/node.cpp",
  "tests/material.cpp",
  "tests/camera.cpp",
  "tests/scene_identity.cpp",
]

[usage]
options = [
  "-Wextra",
  "-Wno-missing-field-initializers",
  "-Wno-gnu-zero-variadic-macro-arguments",
]

[dependencies]
rstd-std = { version = "0.1.0", pub = true }
rstd-cppstd = { version = "0.1.0", pub = true }
rstd-log = { version = "0.1.0", pub = true }
vvk = { version = "0.1.0", pub = true }
wavsen = { git = "https://github.com/hypengw/wavsen.git" }

[dev-dependencies]
rstd-test = { version = "0.1.0" }
